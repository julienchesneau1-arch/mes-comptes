document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.dataset.f === 'potMove') {
    const p = S.pots.find(x => x.id === e.target.dataset.id), v = Math.abs(parseNumber(f.get('amount'))), sign = +(e.submitter?.value || 1);
    if (!(v > 0)) return toast('Montant non compris');
    p.moves.push({ date: today(), amount: sign * v, note: sign > 0 ? 'ajout' : 'retrait' });
    closeSheet(); save(); render();
    if (sign > 0) { $('#pe-' + p.id)?.classList.add('pop'); toast(`+${eur(v, 2)} pour ${p.emoji} ${p.name} 💪`); }
    return;
  }
  if (e.target.dataset.f === 'unlock') return unlock(String(f.get('pin') || ''));
  if (e.target.dataset.f === 'newpin') return createPin(String(f.get('pin') || ''), String(f.get('pin2') || ''), e.target.dataset.mode).catch(err => lockMsg('Impossible : ' + err.message));
  if (e.target.dataset.f === 'forgot') {
    if (String(f.get('ok') || '').trim().toUpperCase() !== 'EFFACER') return lockMsg('Tapez EFFACER pour confirmer.');
    for (const k of [VAULT, VAULT + '-secours', UIKEY, TRIES, KEY, KEY + '-secours']) try { localStorage.removeItem(k); } catch {}
    jlog('téléphone effacé (code oublié)');
    idb.all().then(xs => Promise.all(xs.map(x => idb.del(x.id)))).catch(() => {}).finally(() => { showLock('create'); toast('Téléphone effacé : choisissez un nouveau code'); });
    return;
  }
  if (e.target.dataset.f === 'changepin') return changePin(String(f.get('cur') || ''), String(f.get('pin') || ''), String(f.get('pin2') || ''));
  if (e.target.dataset.f === 'paste') return receiveSync(f.get('t'));
  if (e.target.dataset.f === 'code') {
    const c = String(f.get('code') || ''), p = pendingSealed;
    if (!validCode(c)) return toast('Le code a 12 lettres et chiffres (XXXX-XXXX-XXXX)');
    if (!p) return closeSheet();
    return p.kind === 'file' ? restoreText(p.text, c) : receiveSync(p.text, false, c);
  }
  if (e.target.dataset.f === 'setup') {
    const p1 = String(f.get('p1') || '').trim().slice(0, 30), p2 = String(f.get('p2') || '').trim().slice(0, 30);
    if (!p1) return toast('Votre prénom, pour commencer');
    S.people = [{ id: 'p1', name: p1 }, ...(p2 ? [{ id: 'p2', name: p2 }] : [])]; S.bank = f.get('bank') || 'bp'; S.setup = true;
    ui.who = 'p1'; try { localStorage.setItem('mescomptes-who', 'p1'); } catch {}
    save(); render(); scrollTo(0, 0); return toast(`Enchanté ${p1} 👋`);
  }
  if (e.target.dataset.f === 'remind') {
    const pick = Object.fromEntries(['day', 'week', 'month'].map(k => [k, f.get(k) ? f.get(k + 'T') || '20:00' : '']));
    if (!Object.values(pick).some(Boolean)) return toast('Choisissez au moins un rappel');
    myRit().ics = today(); save(); closeSheet(); render();
    const ics = ritualsIcs(pick, location.origin + location.pathname, today());
    if (OS === 'ios') {
      // iPhone : la feuille de partage n'a pas « Calendrier », mais Safari ouvre un fichier agenda en ligne avec « Ajouter tout ».
      // Heures proposées par défaut : le fichier publié avec l'app ; heures choisies : le même fichier, fabriqué ici.
      const std = pick.day === '20:30' && pick.week === '18:00' && pick.month === '19:00';
      const u = std ? new URL('rappels.ics', location.href).href : URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      if (!window.open(u, '_blank')) location.href = u;
      return toast('Touchez « Ajouter tout » pour créer les rappels');
    }
    if (OS === 'android') return openSheet(`<h2 style="margin-top:0">🔔 Dans Google Agenda</h2><p class="sm mute" style="margin-top:0">Touchez chaque rappel, puis <b>Enregistrer</b> dans Agenda. Il se répète tout seul.</p>
      ${googleCalLinks(pick, location.origin + location.pathname, today()).map(g => `<a class="choice" href="${esc(g.href)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><span class="em" style="--c:var(--acc)">📅</span><span class="grow"><b>${esc(g.title.replace('Mes Comptes · ', ''))}</b></span><span class="mute">›</span></a>`).join('')}
      <p class="sm mute">Agenda prévient selon son réglage habituel : mettez « 0 minute avant » si vous voulez l'alerte pile à l'heure.</p>
      <div class="chips"><button class="btn ghost" style="flex:1" data-a="closeSheet">Terminé</button></div>`);
    return btnDl(new File([ics], 'Rappels Mes Comptes.ics', { type: 'text/calendar' }), 'Rappels Mes Comptes');
  }
  if (e.target.dataset.f === 'quick') {
    const v = Math.abs(parseNumber(f.get('amount'))), acc = f.get('acc');
    if (!(v > 0)) return toast('Montant non compris');
    const amount = f.get('sign') === '1' ? v : -v;
    (S.quickAcc ||= {})[ui.who] = acc; ui.month = (f.get('date') || today()).slice(0, 7);
    closeSheet(); return notePending({ acc, date: f.get('date') || today(), amount, label: f.get('label').trim(), cat: f.get('cat') });
  }
  if (e.target.dataset.f === 'newAsset') {
    const n = parseNumber(f.get('value'));
    if (isNaN(n)) return toast('Montant non compris');
    (S.assets ||= []).push({ id: Date.now().toString(36), owner: ui.who, name: f.get('name').trim(), value: n, date: today() });
  } else if (e.target.dataset.f === 'newLoan') {
    const n = parseNumber(f.get('remaining'));
    if (isNaN(n)) return toast('Montant non compris');
    (S.loans ||= []).push({ id: Date.now().toString(36), owner: ui.who, name: f.get('name').trim(), remaining: n, date: today() });
  } else if (e.target.dataset.f === 'newPot') {
    const n = parseNumber(f.get('target'));
    if (!(n > 0)) return toast('Montant visé non compris');
    S.pots.push({ id: Date.now().toString(36), owner: ui.who, acc: f.get('acc') || null, emoji: f.get('emoji') || '🎯', name: f.get('name').trim(), target: n, moves: [] });
    toast('Objectif créé. Chaque petit montant compte.');
  }
  save(); render();
});

async function pdfPages(buf) {
  await import('./vendor/pdfjs/polyfill-safari.mjs'); // correctif Safari, avant pdf.js
  const pdfjs = await import('./vendor/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/worker-safari.mjs';
  // Un lecteur par relevé, fermé dès la lecture finie : laissés ouverts, 34 relevés = 34 lecteurs, et l'iPhone ferme l'app avant l'enregistrement.
  const task = pdfjs.getDocument({ data: buf, isEvalSupported: false });
  try {
    const doc = await task.promise, pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const { items } = await (await doc.getPage(p)).getTextContent();
      pages.push(items.filter(i => i.str && i.str.trim()).map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width })));
    }
    return pages;
  } finally { task.destroy().catch(() => {}); }
}
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { return new TextDecoder('windows-1252').decode(buf); }
}
$('#file').addEventListener('change', async e => { const files = [...e.target.files]; e.target.value = ''; await importFiles(files); });
async function importFiles(files) {
  endDemo(true);
  importing = true;
  try { await importAll(files); } finally { importing = false; if (lockLater) { lockLater = false; lockNow(); } }
}
async function importAll(files) {
  let added = 0, dup = 0, created = 0; const errs = [], notes = [];
  snapshot(`Avant l'import de ${plural(files.length, 'fichier')}`); // capturée tout de suite ; ne retarde jamais l'import
  jlog(`import de ${plural(files.length, 'fichier')} · ${S.tx.length} op. avant`);
  const owner = ui.who === 'foyer' ? null : ui.who;
  let k = 0;
  for (const f of files) {
    if (files.length > 1) toast(`⏳ Lecture ${++k} / ${files.length}… gardez l'app ouverte`); else toast('⏳ Lecture du fichier…');
    if (/\.json$/i.test(f.name)) { await restoreFile(f); continue; }
    try {
      const head = new Uint8Array(await f.slice(0, 5).arrayBuffer());
      let parsed;
      if (String.fromCharCode(...head) === '%PDF-') {
        const pages = await pdfPages(await f.arrayBuffer());
        if (!pages.some(p => p.length)) throw new Error('PDF scanné (image) : téléchargez plutôt le relevé depuis l\'appli ou le site');
        parsed = parsePDF(pages, f.name);
      } else {
        const txt = await readText(f);
        if (isTreso(txt)) {
          const r = parseTreso(txt, S.people);
          parsed = r.parsed; S.histBal = r.balances;
          S.levers = { cat: { ...r.levers.cat, ...S.levers.cat }, merchant: { ...r.levers.merchant, ...S.levers.merchant } };
          const ms = new Set(parsed.flatMap(p => p.rows.map(x => x.date.slice(0, 7))));
          notes.push(`📒 Tableau de suivi : ${ms.size} mois d'historique, ${Object.keys(r.levers.cat).length + Object.keys(r.levers.merchant).length} décisions reprises (X, NEGO…)`);
        } else if (isJournal(txt)) {
          const acc = quickAcc();
          if (!acc) throw new Error('importez d\'abord un relevé : il crée le compte de la carte');
          let n = 0; for (const r of parseJournal(txt)) if (addPending(S, { acc, ...r })) n++;
          notes.push(`📱 Journal de paiements : ${plural(n, 'paiement')} ajouté${n > 1 ? 's' : ''} sur ${accName(acc)} (déjà connus ignorés)`);
          parsed = [];
        } else parsed = /OFXHEADER|<OFX>/i.test(txt) ? parseOFX(txt) : parseCSV(txt, f.name);
      }
      // Fichier sans numéro de compte : retrouvé par ses opérations déjà connues, sinon on demande (une fois)
      for (const p of parsed) if (p.weak && p.rows.length) {
        const m = matchAccount(S, p.rows);
        if (m) { p.account = m; jlog(`fichier ${k || 1}/${files.length} : sans numéro de compte, rattaché par ses opérations`); }
        else if (p.weak === 'name') {
          const key = safeKey(p.account), accs = Object.entries(S.accounts).filter(([, a]) => !a.hist);
          const same = accs.filter(([id, a]) => a.src === key || id === key); // même nom de fichier qu'avant, sur ce téléphone
          if (same.length === 1) p.account = same[0][0];
          else if (accs.length) { const c = await pickAccount(f.name, same.length ? same : accs); if (c) p.account = c; jlog(`fichier ${k || 1}/${files.length} : compte choisi (${c ? 'existant' : 'nouveau'})`); }
        }
      }
      const r = importParsed(S, parsed, owner);
      jlog(`fichier ${k || 1}/${files.length} lu : +${r.added} (${r.dup} déjà connues)`);
      if (r.added) save(); // gardé tout de suite : si l'iPhone interrompt l'import, les relevés déjà lus restent
      added += r.added; dup += r.dup; created += r.created.filter(id => !S.accounts[id].hist).length;
      for (const p of parsed) if (p.check) notes.push(`⚠ ${S.accounts[p.account].name} : ${eur(p.check, 2)} d'écart entre les soldes du relevé et les opérations lues`);
    } catch (err) { jlog(`fichier ${k || 1}/${files.length} : erreur ${err && err.message || err}`); errs.push(`✘ ${f.name} : ${err.message || err}` + (/\.pdf$/i.test(f.name) && !bank().bpce ? ' · Astuce : sur le site de votre banque, « Exporter les opérations » en CSV ou OFX fonctionne avec toutes les banques.' : '')); }
  }
  if (added) S.lastImport = new Date().toISOString();
  autoRecurring(S, today());
  save();
  if (files.every(f => /\.json$/i.test(f.name))) return; // sauvegarde seule : son propre message suffit
  ui.month = landingMonth(); if (ui.tab === 'set') ui.tab = 'home'; render();
  toast([`${plural(added, 'opération')} ajoutée${added > 1 ? 's' : ''}` + (dup ? ` · ${dup} déjà connue${dup > 1 ? 's' : ''}` : ''),
    ...(created && owner ? [`${created} nouveau${created > 1 ? 'x' : ''} compte${created > 1 ? 's' : ''} pour ${whoName(owner)}`] : []), ...notes, ...errs].join('\n'));
}
// Android : fichiers « partagés » vers l'app (depuis l'app de la banque, un e-mail…), déposés par le service worker.
async function takeShared() {
  if (!booted) return;
  if (!new URLSearchParams(location.search).has('partage')) return;
  history.replaceState(null, '', location.pathname);
  try {
    const c = await caches.open('mescomptes-partage'), files = [];
    for (const k of await c.keys()) {
      const r = await c.match(k);
      files.push(new File([await r.blob()], decodeURIComponent(r.headers.get('X-Nom') || 'Document'), { type: r.headers.get('Content-Type') || '' }));
      await c.delete(k);
    }
    if (files.length) await importFiles(files);
  } catch (e) { toast('Fichier reçu, mais lecture impossible : ' + e.message); }
}
$('#backup').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await restoreFile(f); });
async function restoreFile(f) { endDemo(true); return restoreText(await f.text()); }
async function restoreText(text, code) {
  try {
    let data;
    try { data = await openBackup(text, code || S.code); }
    catch (e) { if (!e.needCode) throw e; return code ? toast('Code incorrect : vérifiez-le') : askCode('file', text); }
    if (code) { S.code = fmtCode(code); S.codeShown = true; }
    closeSheet();
    if (!Array.isArray(data.tx)) throw new Error('ce n\'est pas une sauvegarde Mes Comptes');
    const n0 = S.tx.length;
    await snapshot('Avant une fusion de sauvegarde');
    S = migrate(mergeStates(S, migrate(data))); autoRecurring(S, today()); ui.month = null; ui.acc = 'all'; save(); render();
    toast(`Fusion faite ✔ · ${plural(S.tx.length - n0, 'opération')} ajoutée${S.tx.length - n0 > 1 ? 's' : ''}\nRien n'a été effacé sur cet appareil.`);
  } catch (err) { toast('Import impossible : ' + err.message); }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');

// Liens d'entrée : raccourci de l'icône (« ?saisie ») et automatisation Android (« #t=texte de la notification » ou « #add=12,50&m=Carrefour »).
// Aussi quand l'app est déjà ouverte (seul le « # » change : la page ne se recharge pas).
function entryFromUrl() {
  if (!booted) return; // traité après le code
  const q = new URLSearchParams(location.search), h = /^#(t|add)=/.test(location.hash) ? new URLSearchParams(location.hash.slice(1)) : new URLSearchParams();
  if (q.has('saisie')) { history.replaceState(null, '', location.pathname); A.quick(); }
  // « #t=… » : le texte reste sur le téléphone (ce qui suit « # » n'est jamais envoyé au site) ; « ?t=… » reste accepté
  const t = h.get('t') || q.get('t'), add = h.get('add') || q.get('add');
  if (t || add) {
    history.replaceState(null, '', location.pathname);
    const row = t ? parseJournal(`${today()};${t}`)[0] : { date: today(), amount: -Math.abs(parseNumber(add)), label: h.get('m') || q.get('m') || 'Paiement' };
    if (row && row.amount) notePending(row); else toast('Paiement non compris : ' + (t || add));
  }
}
