<title>Mes Comptes</title>
<style>
/* Direction artistique « calme et premium » : fond chaud, cartes sans bordure, jamais de rouge (on ne juge pas).
   Code couleur, le même partout : vert = ça roule · ambre = à surveiller · orange brûlé = serré · gris = pas encore connu. */
:root{
  --bg:#f4f2ee;--card:#fff;--soft:#f0eee9;--ink:#101413;--mute:#6b736f;--line:#e9e6df;
  --acc:#0e9f6e;--acc-ink:#fff;--accs:#e2f4eb;--warm:#b7700a;--warms:#fbf0dc;
  --good:#0e9f6e;--goods:#e2f4eb;--watch:#b7700a;--watchs:#fbf0dc;--tight:#c2410c;--tights:#fde8dc;--unk:#8a948f;--unks:#eceae5;
  --hero1:#0d1513;--hero2:#123028;--hero-ink:#f3f7f5;--hero-mute:#9db3a9;--hero-pos:#86efc0;
  --r:24px;--shadow:0 1px 2px rgba(16,24,20,.04),0 10px 30px -8px rgba(16,24,20,.10);
  --num:ui-rounded,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0c0b;--card:#131715;--soft:#1a1f1c;--ink:#eef3f0;--mute:#93a19a;--line:#232a26;
  --acc:#34d399;--acc-ink:#04150d;--accs:#0f2a1f;--warm:#f2b453;--warms:#2b2213;
  --good:#34d399;--goods:#0f2a1f;--watch:#f2b453;--watchs:#2b2213;--tight:#fb8a5a;--tights:#2e1a12;--unk:#93a19a;--unks:#1d221f;
  --hero1:#0f1a16;--hero2:#163a2e;--shadow:0 0 0 1px var(--line);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;letter-spacing:-.005em;font-variant-numeric:tabular-nums;padding-bottom:calc(112px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:920px;margin:0 auto}
header h1{font-family:var(--num);font-size:20px;margin:0 auto 0 0;letter-spacing:-.02em;font-weight:700}
.who,.month{display:flex;gap:2px;background:var(--soft);border-radius:14px;padding:3px;overflow-x:auto;max-width:100%}
.who button{border:0;background:none;border-radius:11px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--mute);transition:.2s}
.who button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.month{align-items:center}
.month b{min-width:124px;text-align:center;font-weight:600;text-transform:capitalize;font-size:14px}
.ib{border:0;background:none;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--mute)}
.ib:hover{background:var(--card);color:var(--ink)}
.gear{border:0;background:var(--soft);border-radius:14px;width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--mute)}
.accchip{border:0;background:var(--accs);color:var(--acc);border-radius:14px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
main{max-width:920px;margin:0 auto;padding:6px 16px 24px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){main.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.span{grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 14px;font-weight:600}
.hero{position:relative;overflow:hidden;color:var(--hero-ink);background:radial-gradient(110% 130% at 100% 0%,color-mix(in srgb,var(--acc) 38%,transparent) 0%,transparent 55%),linear-gradient(160deg,var(--hero1),var(--hero2));box-shadow:0 18px 40px -18px rgba(14,60,44,.55)}
.hero .mute{color:var(--hero-mute)} .hero .pos{color:var(--hero-pos)}
.hero .chips span{background:rgba(255,255,255,.09);color:var(--hero-ink)}
.hero .fresh{position:absolute;top:18px;right:18px;font-size:12px;color:var(--hero-mute)}
.big{font-family:var(--num);font-size:clamp(46px,13vw,68px);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:4px 0}
.mute{color:var(--mute)} .sm{font-size:13px} .pos{color:var(--acc)} .warm{color:var(--warm)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips span{background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.click{cursor:pointer;transition:opacity .15s} .click:active{opacity:.6}
.em{width:36px;height:36px;border-radius:12px;display:grid;place-content:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--c,#94a3b8) 16%,transparent)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:7px 0 3px;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.over>i{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.4) 6px 12px)}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.note{background:var(--accs);border-radius:16px;padding:12px 14px;font-size:14px}
.sort{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.cal i{aspect-ratio:1;border-radius:10px;background:var(--soft);display:grid;place-content:center;font-size:11px;font-style:normal;color:var(--mute)}
.cal i.free{background:var(--accs);color:var(--acc);font-weight:700}
.cal i.unknown{background:none;border:1.5px dashed var(--line)}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
input.f,select.f{background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input.f:focus,select.f:focus{border-color:var(--acc);outline:0;background:var(--card)}
.op{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.amt{font-weight:600;white-space:nowrap;font-family:var(--num)}
select.pill{border:0;background:var(--soft);border-radius:99px;padding:5px 8px;font-size:12px;max-width:44px}
@media(min-width:620px){select.pill{max-width:170px}}
.day{font-size:12px;color:var(--mute);text-transform:capitalize;margin:16px 0 2px;font-weight:600}
.pot{display:flex;gap:14px;align-items:flex-start}
.pot .emo{font-size:34px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.grid2>*{min-width:0}
.empty{text-align:center;padding:40px 22px}
.empty ol{text-align:left;max-width:520px;margin:16px auto;line-height:1.7}
nav#tabs{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 10px 40px -10px rgba(0,0,0,.25),0 0 0 1px var(--line)}
nav#tabs button{flex:1;border:0;background:none;padding:6px 0;border-radius:18px;cursor:pointer;font-size:10.5px;color:var(--mute);display:grid;justify-items:center;gap:2px;transition:.2s}
nav#tabs button span{font-size:19px;line-height:1.2}
nav#tabs button[aria-current]{color:var(--acc);font-weight:600;background:var(--accs)}
nav#tabs .add span{background:var(--acc);color:var(--acc-ink);width:44px;height:44px;border-radius:16px;display:grid;place-content:center;font-size:22px;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
nav#tabs .add{font-size:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--bg);padding:12px 18px;border-radius:18px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);white-space:pre-line;z-index:9;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop{animation:pop .5s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>section{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
main>section:nth-child(2){animation-delay:.04s} main>section:nth-child(3){animation-delay:.08s} main>section:nth-child(4){animation-delay:.12s}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.trend .col{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:12px;padding:4px 0}
.trend .col.on{background:var(--soft)}
.trend .bars{height:110px;display:flex;align-items:flex-end;gap:3px}
.trend .bars i{width:12px;border-radius:5px 5px 2px 2px;display:block}
.trend.t12{grid-template-columns:repeat(12,1fr);gap:3px}
.trend.t12 .bars i{width:6px}
.trend.t12 .bars{height:120px;gap:2px}
.line{width:100%;height:120px;display:block}
.tblw{overflow-x:auto;margin:0 -20px;padding:0 20px}
.tbl{border-collapse:collapse;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th{color:var(--mute);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left;position:sticky;left:0;background:var(--card);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.sec td{font-weight:700;background:var(--soft)} .tbl tr.sec td:first-child{background:var(--soft)}
select.lv{border:0;background:var(--soft);border-radius:99px;padding:5px 8px;font-size:12px;max-width:170px}
details summary{cursor:pointer;color:var(--mute);font-size:15px;padding:8px 0;min-height:44px;display:flex;align-items:center}
.tag{font-size:11px;background:var(--soft);border-radius:99px;padding:2px 8px;color:var(--mute)}
.act{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:2px}
.act .chips{margin-top:10px}
.gain{color:var(--acc);font-weight:700;white-space:nowrap;text-align:right;font-family:var(--num)}
.gain small{display:block;font-weight:400;color:var(--mute);font-size:11px;font-family:inherit}
.hb{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:7px 0}
.hb .bar{grid-column:2/4;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpis b{font-size:30px;letter-spacing:-.03em;display:block;font-family:var(--num)}
.step{display:inline-grid;place-content:center;width:22px;height:22px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}
.pr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pr .ctl{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fc .em{width:26px;height:26px;font-size:14px;border-radius:8px}
[hidden]{display:none!important}
.hint{display:none}
#saveWarn{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--tights);color:var(--tight);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:var(--shadow)}
body.locked>header,body.locked>main,body.locked>nav{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#lock .box{width:100%;max-width:380px;text-align:center}
#lock .pin{width:100%;font-size:26px;letter-spacing:.35em;text-align:center;margin-top:8px}
.stale{background:var(--warms);box-shadow:none;padding:14px 16px}
.demo{background:var(--accs);box-shadow:none;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Météo du mois : la couleur du grand bloc dit tout de suite où l'on en est */
.hero.w-watch{background:radial-gradient(110% 130% at 100% 0%,rgba(245,158,11,.42) 0%,transparent 55%),linear-gradient(160deg,#17130b,#3a2a0e)}
.hero.w-watch .pos,.hero.w-watch .big{color:#fcd34d}
.hero.w-tight{background:radial-gradient(110% 130% at 100% 0%,rgba(234,88,12,.45) 0%,transparent 55%),linear-gradient(160deg,#1a0f0a,#43200f)}
.hero.w-tight .pos,.hero.w-tight .big{color:#fdba74}
.hero.w-wait{background:radial-gradient(110% 130% at 100% 0%,rgba(148,163,184,.35) 0%,transparent 55%),linear-gradient(160deg,#121517,#273036)}
.hero.w-wait .pos,.hero.w-wait .big{color:#e2e8f0}
.wx{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 12px;min-height:36px;margin:0 0 8px -2px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.12);color:var(--hero-ink)}
.lg{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lg i{width:14px;height:14px;border-radius:50%;flex:none}
.d{font-size:13px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.d.up{background:var(--watchs);color:var(--watch)} .d.down{background:var(--goods);color:var(--good)}
.st-good{color:var(--good)} .st-watch{color:var(--watch)} .st-tight{color:var(--tight)} .st-unk{color:var(--unk)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:14px}
.coach{background:var(--accs);border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.coach p{margin:0 0 10px}
.btn.warnbtn{background:var(--warm);color:#fff}
.scroller{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch} .scroller::-webkit-scrollbar{display:none} .scroller>*{flex:none} section.hints .hint{display:block}
.info{border:0;background:var(--soft);color:var(--mute);border-radius:99px;min-width:44px;min-height:32px;font-size:16px;margin:-6px 0 -6px 4px;vertical-align:middle;cursor:pointer}
section.hints .info{background:var(--acc);color:#fff}
.hsub{border:0;background:none;color:var(--hero-mute);font:inherit;font-size:16px;padding:4px 0;min-height:44px;cursor:pointer}
.hsub .i{opacity:.8}
.pace{margin-top:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);font-size:16px}
.pace.good b{color:var(--hero-pos)} .pace span{display:block;font-size:14px;color:var(--hero-mute);margin-top:2px}
.ritual{border:1.5px solid color-mix(in srgb,var(--acc) 35%,transparent)} .ritual .tag{font-size:14px;color:var(--ink);padding:4px 10px} /* sinon une classe avec « display » réaffiche un élément masqué */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.amt-in{font-family:var(--num);font-size:44px;font-weight:700;border:0;background:none;width:100%;text-align:center;outline:0;color:var(--ink);letter-spacing:-.03em}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--soft);border-radius:18px;padding:16px;margin-top:10px;cursor:pointer}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg label{flex:1;text-align:center;padding:7px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--mute)}
.seg input{display:none} .seg input:checked+span{color:var(--ink);font-weight:600}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.goal{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--num);font-size:20px}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:var(--soft)} .ring .pg{stroke:var(--acc);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
/* Téléphone d'abord : texte 16 px (et pas de zoom iOS dans les champs), secondaire 14 px, tout ce qui se touche ≥ 44 px. */
body{font-size:16px}
.sm,.chips span,.day{font-size:14px} .tag{font-size:12px} .card h2{font-size:14px;letter-spacing:.06em} .tbl{font-size:14px}
.gain small{font-size:13px} .step{width:24px;height:24px;font-size:14px} .cal i{font-size:13px} .trend .col span{font-size:13px}
input[type=checkbox]{width:22px;height:22px;vertical-align:-5px;accent-color:var(--acc)}
label:has(input[type=checkbox]){display:inline-flex;align-items:center;gap:8px;min-height:44px}
header{flex-wrap:nowrap;gap:8px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
.whobtn{border:0;background:var(--soft);border-radius:14px;height:44px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.month{flex:1;justify-content:space-between;min-width:0} .month b{min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{min-width:44px;min-height:44px} .gear{width:44px;height:44px;flex:none}
header .accchip{position:absolute;left:16px;top:100%;margin-top:4px;min-height:36px}
.btn.sm{min-height:44px;padding:10px 14px;font-size:14px}
input.f,select.f{min-height:46px;font-size:16px}
nav#tabs button{font-size:12px;min-height:54px}
.hb{min-height:52px} .row.click,.op{min-height:56px}
.op{cursor:pointer} .op:active{background:var(--soft)}
.op .amt{font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.filters>*{flex:none;width:auto!important}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tiles button{border:2px solid transparent;background:var(--soft);border-radius:16px;min-height:72px;padding:8px 4px;cursor:pointer;display:grid;justify-items:center;align-content:center;gap:4px;font-size:13px;color:var(--ink)}

<body class="locked">
<div id="lock" hidden></div>
<div id="saveWarn" hidden data-a="diag"></div>
<header>
  <button class="whobtn" id="whoBtn" data-a="whoSheet" aria-label="Changer de profil"></button>
  <div class="month"><button class="ib" data-a="prev" aria-label="Mois précédent">‹</button><b id="mlabel"></b><button class="ib" data-a="next" aria-label="Mois suivant">›</button></div>
  <button class="accchip" id="accChip" data-a="clearAcc" hidden></button>

</header>
<main id="view"></main>
<nav id="tabs">

  <button data-a="tab" data-t="ops"><span>☰</span>Opérations</button>
  <button class="add" data-a="plus" aria-label="Ajouter"><span>＋</span>Ajouter</button>

  <button data-a="tab" data-t="accounts"><span>🏦</span>Comptes</button>

<input type="file" id="file" accept=".csv,.ofx,.pdf,.txt" multiple hidden>
<input type="file" id="backup" accept=".json,application/json" hidden>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" role="status"></div>
<script src="core.js?v=40"></script>
<script>
const KEY = 'mescomptes-v1', VERSION = 40;
const blank = () => ({ people: [{ id: 'p1', name: 'Moi' }],
  accounts: {}, tx: [], rules: {}, budgets: {}, pots: [], claimed: {}, challenges: {}, payers: {}, annualHide: {}, loans: [],
  levers: { cat: {}, merchant: {} }, histBal: null, done: {}, snooze: {}, assets: [], quickAcc: {}, reconciled: [], checkins: {}, noSpend: {}, rit: {} });
// Rien n'est lu avant le code d'entrée : les données ne sont stockées que chiffrées (coffre), la clé ne vit qu'en mémoire.
let S = blank();
const VAULT = 'mescomptes-coffre', TRIES = 'mescomptes-essais';
let VKEY = null, VSALT = null, booted = false, vaultHasTx = false, resume = null, hiddenAt = 0, importing = false, lockLater = false;
const ui = { tab: 'home', month: null, acc: 'all', q: '', cat: '', showInt: false, sort: false, who: lsGet('mescomptes-who') || 'foyer' };
// La dernière session : onglet, mois, compte, recherche, filtres, position dans la page, dépense en cours de saisie (chiffrée elle aussi).
const UIKEY = 'mescomptes-ui', TABS = ['home', 'ops', 'save', 'accounts', 'trends', 'set'];
const $ = s => document.querySelector(s);

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
// Anciennes sauvegardes (avant les profils) : tout passe sous « Foyer ».
function migrate(d) {
  d = Object.assign(blank(), d && typeof d === 'object' ? d : {});
  const o = x => (x && typeof x === 'object' ? x : {});
  d.budgets = o(d.budgets); d.claimed = o(d.claimed); d.accounts = o(d.accounts); d.levers = o(d.levers);
  if (Object.values(d.budgets).some(v => typeof v === 'number')) d.budgets = { foyer: d.budgets };
  for (const k of Object.keys(d.claimed)) if (/^\d{4}-/.test(k)) { d.claimed['foyer|' + k] = d.claimed[k]; delete d.claimed[k]; }
  for (const p of Array.isArray(d.pots) ? d.pots : []) if (p && typeof p === 'object') p.owner ||= 'foyer';
  for (const a of Object.values(d.accounts)) if (a && typeof a === 'object' && a.owner === undefined) a.owner = 'commun';
  return Object.assign(blank(), sanitizeState(d)); // tout est vérifié : stockage, sauvegarde, synchro, version précédente
}
// Copies automatiques : les 5 dernières versions des données, prises avant chaque opération lourde
// (import, fusion, suppression, effacement). IndexedDB : bien plus de place que le stockage principal.
const idb = (() => {
  let db;
  const open = () => db ||= new Promise((res, rej) => {
    setTimeout(() => rej(new Error('IndexedDB ne répond pas')), 5000); // les copies de secours ne doivent jamais bloquer l'app
    const r = indexedDB.open('mescomptes', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('snap', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('snap', mode), q = fn(t.objectStore('snap')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return { put: v => run('readwrite', s => s.put(v)), all: () => run('readonly', s => s.getAll()), del: id => run('readwrite', s => s.delete(id)) };
})();
async function snapshot(reason) {
  if (!S.tx.length || (typeof ui !== 'undefined' && ui.demo) || !VKEY) return;
  const json = JSON.stringify(S), id = Date.now(), n = S.tx.length; // capturé tout de suite, avant toute modification
  try {
    await idb.put({ id, reason, n, enc: 1, data: await vaultSeal(json, VKEY) }); // chiffrée, comme tout le reste
    for (const x of (await idb.all()).sort((a, b) => b.id - a.id).slice(5)) await idb.del(x.id);
  } catch { /* navigation privée ou stockage plein : l'app continue sans copie */ }
}
async function fillSnaps() {
  const el = $('#snaps'); if (!el) return;
  let list = [];
  try { list = (await idb.all()).sort((a, b) => b.id - a.id); } catch {}
  el.innerHTML = list.length ? list.map(x => `<div class="row"><span class="grow"><b>${new Date(x.id).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</b>
      <div class="sm mute">${esc(x.reason)} · ${plural(x.n, 'opération')}</div></span><button class="btn sm ghost" data-a="undo" data-id="${x.id}">Revenir à cette version</button></div>`).join('')
    : '<p class="sm mute">Aucune copie pour l\'instant : la première sera faite avant votre prochain import.</p>';
}

// Anciennes données en clair (versions d'avant le code d'entrée) : lues une seule fois, pour être chiffrées puis effacées.
function legacyLoad() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch {}
  if (!raw) return blank();
  try { return migrate(JSON.parse(raw)); }
  catch { try { return Object.assign(blank(), sanitizeState(JSON.parse(raw))); } catch { return blank(); } }
}
const vaultMeta = () => { try { return JSON.parse(localStorage.getItem(VAULT)) || null; } catch { return null; } };
// Écrit puis relu : un enregistrement n'est compté comme fait que s'il est réellement sur le téléphone.
// ponytail: sans compression ≈ 330 Ko pour 1 000 opérations ; passer le coffre dans IndexedDB si un foyer approche la limite de 5 Mo.
async function writeVault(json, n) {
  const t0 = Date.now(), val = JSON.stringify({ v: 2, salt: VSALT, iter: VAULT_ITER, data: await vaultSeal(json, VKEY) });
  localStorage.setItem(VAULT, val);
  if (localStorage.getItem(VAULT) !== val) throw new Error('relecture différente');
  vaultHasTx = n > 0; lastSave = { at: Date.now(), n }; saveWarn('');
  jlog(`enregistré · ${n} op. · ${Date.now() - t0} ms · ${Math.round(val.length / 1024)} Ko`);
}
// Journal de bord, sans montant, libellé ni nom de fichier : gardé sur le téléphone même si l'app est tuée, pour voir où ça coince.
const JOURNAL = 'mescomptes-journal';
function jlog(e) {
  try { const j = JSON.parse(localStorage.getItem(JOURNAL) || '[]'); j.push(new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + e); localStorage.setItem(JOURNAL, JSON.stringify(j.slice(-80))); } catch {}
}
let lastSave = null;
function saveWarn(msg) { const w = $('#saveWarn'); if (w) { w.hidden = !msg; w.textContent = msg ? '⚠️ ' + msg + ' Touchez ici pour le détail.' : ''; } }
// Enregistrement : chiffré, dans l'ordre ; jamais des données vides par-dessus des opérations (sauf « Tout effacer »), jamais en découverte.
let allowEmpty = false, saving = Promise.resolve();
function save() {
  if ((typeof ui !== 'undefined' && ui.demo) || !VKEY) return;
  if (!S.tx.length && !allowEmpty && vaultHasTx) return;
  const json = JSON.stringify(S), n = S.tx.length; allowEmpty = false;
  const dog = setTimeout(() => { jlog('enregistrement toujours en cours après 10 s'); saveWarn('L\'enregistrement ne se termine pas sur ce téléphone.'); }, 10000);
  saving = saving.then(() => writeVault(json, n))
    .catch(e => { jlog('ÉCHEC enregistrement : ' + (e && e.message || e)); saveWarn('Vos dernières données ne sont pas enregistrées (' + (e && e.message || e) + ').'); })
    .finally(() => clearTimeout(dog));
}

/* ---------- Code d'entrée ---------- */
const triesState = () => { try { return JSON.parse(localStorage.getItem(TRIES)) || { n: 0, until: 0 }; } catch { return { n: 0, until: 0 }; } };
const lockMode = () => (vaultMeta() ? 'unlock' : lsGet(KEY) ? 'protect' : 'create');
function lockMsg(m, ok) { const el = $('#lockMsg'); if (el) { el.textContent = m; el.className = 'sm ' + (ok ? 'mute' : 'warm'); } }
function showLock(mode = lockMode()) {
  booted = false; VKEY = null; S = blank(); closeSheet();
  // iPhone : Safari et l'icône de l'écran d'accueil ont chacun leur mémoire. Rien ici : les données sont (ou seront) dans l'app
  // de l'icône. Proposer un code dans Safari fabriquerait une seconde app, vide, où l'on retaperait son code sans rien retrouver.
  // Un lien de synchro tapé dans un message s'ouvre aussi dans Safari : on le fait copier pour l'app plutôt que de demander le code ici.
  if (mode === 'here') mode = lockMode();
  else if ((mode === 'create' || (mode === 'unlock' && /sync=/.test(location.hash))) && OS === 'ios' && !standalone()) mode = 'icon';
  document.body.classList.add('locked');
  const pin = (n, ph) => `<input class="f pin" name="${n}" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="${ph}" aria-label="${ph}">`;
  const L = $('#lock'); L.hidden = false;
  L.innerHTML = `<div class="box"><div style="font-size:44px">🔐</div><h1 style="font-family:var(--num);font-size:26px;margin:6px 0 4px">Mes Comptes</h1>
    ${mode === 'unlock' ? `<p class="mute" style="margin:0 0 16px">Entrez votre code</p>
      <form data-f="unlock">${pin('pin', 'Code')}<button class="btn" style="width:100%;margin-top:12px">Entrer</button></form>
      <p id="lockMsg" class="sm mute"></p><button class="btn sm ghost" data-a="forgot">Code oublié ?</button>`
    : mode === 'icon' ? `<p style="margin:0 0 8px"><b>Sur iPhone, Mes Comptes s'ouvre depuis son icône</b></p>
      <p class="sm mute" style="margin:0 0 14px">Safari et l'icône de l'écran d'accueil ont chacun leur propre mémoire : vos données sont dans l'app de l'icône.</p>
      <p style="text-align:left;margin:0 0 8px"><b>Déjà installée ?</b> Fermez Safari et touchez l'icône <b>Mes Comptes</b>, puis votre code.</p>
      <p style="text-align:left;margin:0 0 14px"><b>Pas encore ?</b> Touchez <b>Partager</b> ⬆︎ puis <b>« Sur l'écran d'accueil »</b>, et ouvrez l'app depuis l'icône.</p>
      ${/sync=/.test(location.hash) ? '<button class="btn" style="width:100%" data-a="copyLink">Copier le lien reçu</button><p class="sm mute">puis dans l\'app : ＋ → Synchro → <b>Coller le lien reçu</b>.</p>' : ''}
      <button class="btn sm ghost" data-a="demo">👀 Découvrir avec un exemple</button><button class="btn sm ghost" data-a="lockHere">Utiliser Safari quand même</button>`
    : mode === 'forgot' ? `<p style="margin:0 0 10px"><b>Personne ne peut retrouver votre code</b> : c'est ce qui rend vos données inviolables.</p>
      <p class="sm mute">Pour repartir : effacez ce téléphone, choisissez un nouveau code, puis collez votre dernier <b>lien de synchro ou de sauvegarde</b> (dans vos messages) avec votre <b>code du foyer</b>. Tout revient.</p>
      <form data-f="forgot"><input class="f" name="ok" autocomplete="off" placeholder="Tapez EFFACER" style="width:100%;text-align:center"><button class="btn warnbtn" style="width:100%;margin-top:10px">Effacer ce téléphone</button></form>
      <p id="lockMsg" class="sm mute"></p><button class="btn sm ghost" data-a="lockBack">‹ Retour</button>`
    : `<p style="margin:0 0 6px"><b>${mode === 'protect' ? 'Protégez vos comptes par un code' : 'Choisissez votre code d\'entrée'}</b></p>
      <p class="sm mute" style="margin:0 0 14px">6 chiffres ou plus. Il chiffre toutes vos données sur ce téléphone : sans lui, personne ne peut les lire. Notez-le dans un endroit sûr, personne ne pourra le retrouver pour vous.</p>
      <form data-f="newpin" data-mode="${mode}">${pin('pin', 'Votre code')}${pin('pin2', 'Encore une fois')}<button class="btn" style="width:100%;margin-top:12px">${mode === 'protect' ? 'Protéger mes données' : 'Continuer'}</button></form>
      <p id="lockMsg" class="sm mute"></p>${mode === 'create' ? '<button class="btn sm ghost" data-a="demo">👀 Découvrir d\'abord avec un exemple</button>' : ''}`}
    <p class="sm mute" style="margin-top:18px">Vos données restent sur ce téléphone, chiffrées. Personne d'autre ne les voit.</p></div>`;
  setTimeout(() => L.querySelector('input')?.focus(), 120);
}
async function unlock(pin) {
  const st = triesState();
  if (Date.now() < st.until) return lockMsg(`Trop d'essais : réessayez dans ${Math.ceil((st.until - Date.now()) / 1000)} s.`);
  const m = vaultMeta();
  if (!m) return showLock();
  lockMsg('Ouverture…', true);
  let key, json;
  try { key = await vaultKey(pin, m.salt, m.iter || VAULT_ITER); json = await vaultOpen(m.data, key); }
  catch (e) {
    if (!e.badCode) return lockMsg('Ouverture impossible : ' + e.message);
    const n = st.n + 1, wait = n >= 10 ? 1800 : n >= 8 ? 300 : n >= 5 ? 30 : 0; jlog('code refusé');
    try { localStorage.setItem(TRIES, JSON.stringify({ n, until: Date.now() + wait * 1000 })); } catch {}
    const f = $('#lock input'); if (f) f.value = '';
    return lockMsg(wait ? `Code incorrect. Trop d'essais : attendez ${wait < 60 ? wait + ' s' : wait / 60 + ' min'}.` : `Code incorrect (essai ${n}).`);
  }
  try { localStorage.removeItem(TRIES); } catch {}
  VKEY = key; VSALT = m.salt;
  jlog(`code OK · ouverture du coffre (${(m.data || '').startsWith('v2.') ? 'v2' : 'v1'}, ${Math.round((m.data || '').length / 1024)} Ko)`);
  let data, rawN = 0;
  try { const raw = JSON.parse(json); rawN = Array.isArray(raw && raw.tx) ? raw.tx.length : 0; data = migrate(raw); }
  catch (e) { try { if (!localStorage.getItem(VAULT + '-secours')) localStorage.setItem(VAULT + '-secours', localStorage.getItem(VAULT)); } catch {} data = Object.assign(blank(), sanitizeState(JSON.parse(json)), { rescued: String(e && e.message || e) }); }
  // Sécurité : si la relecture écarte des opérations, le coffre d'origine est gardé à part et rien ne l'écrase par du vide.
  if (data.tx.length < rawN) { jlog(`ATTENTION : ${rawN - data.tx.length} op. écartées à la relecture, coffre d'origine gardé à part`); try { localStorage.setItem(VAULT + '-secours', localStorage.getItem(VAULT)); } catch {} }
  vaultHasTx = rawN > 0 || data.tx.length > 0; jlog(`coffre lu · ${data.tx.length} op.`);
  boot(data);
}
async function createPin(pin, pin2, mode) {
  if (!goodPin(pin)) return lockMsg('6 à 12 chiffres, pas une suite (123456) ni un chiffre répété (000000).');
  if (pin !== pin2) return lockMsg('Les deux codes ne sont pas identiques.');
  lockMsg('Protection en cours…', true);
  VSALT = newSalt(); VKEY = await vaultKey(pin, VSALT); jlog(`code choisi (${mode === 'protect' ? 'protection des données existantes' : 'nouveau départ'})`);
  const data = mode === 'protect' ? legacyLoad() : blank();
  // Des opérations en clair qu'on n'arrive pas à relire : on ne touche à rien plutôt que de protéger une copie vide.
  if (mode === 'protect' && !data.tx.length && /"tx":\[\{/.test(lsGet(KEY) || '')) { VKEY = null; return lockMsg('Vos données n\'ont pas pu être relues : rien n\'a été changé ni effacé.'); }
  await writeVault(JSON.stringify(data), data.tx.length);
  // On relit le coffre avant d'effacer quoi que ce soit en clair : rien ne peut se perdre.
  const back = JSON.parse(await vaultOpen(vaultMeta().data, VKEY));
  if (back.tx.length !== data.tx.length) { VKEY = null; return lockMsg('Vérification impossible : rien n\'a été changé, réessayez.'); }
  for (const k of [KEY, KEY + '-secours', UIKEY, TRIES]) try { localStorage.removeItem(k); } catch {}
  try { for (const x of await idb.all()) if (!x.enc) await idb.del(x.id); } catch {}
  boot(data);
  if (data.tx.length) toast('🔐 Vos données sont maintenant chiffrées sur ce téléphone');
}
// Après le code : on charge la session, puis tout ce qui attendait (liens reçus, fichiers partagés, saisies automatiques).
async function boot(data) {
  S = data;
  // Classement mis à jour : appliqué une fois. Les commerces que le classement public ne connaît plus (enseignes locales retirées
  // du code pour ne rien dévoiler) gardent leur famille sous forme de règles personnelles, enregistrées sur ce téléphone seulement.
  try {
    if (S.tx.length && S.cv !== 5 && !S.rescued) {
      const before = new Map(S.tx.filter(t => !t.manual && t.conf !== 'guess' && t.cat && t.cat !== 'autres').map(t => [t.id, t.cat]));
      recompute(S);
      let kept = 0;
      for (const t of S.tx) if ((t.conf === 'guess' || t.cat === 'autres') && before.has(t.id) && learnable(t) && !S.rules[ruleKey(t)]) { S.rules[ruleKey(t)] = before.get(t.id); kept++; }
      if (kept) recompute(S);
      S.cv = 5; save();
    }
  } catch (e) { console.error(e); }
  resume = null;
  try { const r = JSON.parse(lsGet(UIKEY) || 'null'); if (r && r.enc) resume = JSON.parse(await vaultOpen(r.enc, VKEY)); } catch { resume = null; }
  ui.month = null;
  if (resume && S.tx.length) {
    if (TABS.includes(resume.tab)) ui.tab = resume.tab;
    if (/^\d{4}-\d{2}$/.test(resume.month || '')) ui.month = resume.month;
    if (resume.acc && S.accounts[resume.acc]) ui.acc = resume.acc;
    if (typeof resume.q === 'string') ui.q = resume.q.slice(0, 80);
    if (typeof resume.cat === 'string' && (!resume.cat || CAT[resume.cat])) ui.cat = resume.cat;
    ui.showInt = !!resume.showInt; ui.sort = !!resume.sort;
  }
  booted = true;
  document.body.classList.remove('locked'); $('#lock').hidden = true; $('#lock').innerHTML = '';
  if (autoRecurring(S, today())) save();
  render(); restoreSession(); takeShared(); syncFromUrl(); entryFromUrl();
}
// Verrouillage : à la demande, et tout seul après 5 minutes en arrière-plan.
async function lockNow() { jlog('verrouillage'); if (ui.demo) endDemo(true); try { await saving; } catch {} $('#view').innerHTML = ''; showLock('unlock'); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); jlog('arrière-plan'); }
  else if (hiddenAt) jlog(`retour après ${Math.round((Date.now() - hiddenAt) / 1000)} s`);
  if (document.hidden) return;
  if (booted && VKEY && hiddenAt && Date.now() - hiddenAt > 5 * 60e3) { if (importing) lockLater = true; else lockNow(); } // un import en cours finit d'abord
});
async function changePin(cur, pin, pin2) {
  if (!goodPin(pin)) return toast('6 à 12 chiffres, pas une suite ni un chiffre répété');
  if (pin !== pin2) return toast('Les deux nouveaux codes ne sont pas identiques');
  const m = vaultMeta();
  try { await vaultOpen(m.data, await vaultKey(cur, m.salt, m.iter || VAULT_ITER)); } catch { return toast('Code actuel incorrect'); }
  const oldKey = VKEY, salt = newSalt(), key = await vaultKey(pin, salt);
  await saving;
  VKEY = key; VSALT = salt;
  await writeVault(JSON.stringify(S), S.tx.length);
  try { for (const x of await idb.all()) await idb.put({ ...x, enc: 1, data: await vaultSeal(x.enc ? await vaultOpen(x.data, oldKey) : x.data, key) }); } catch {}
  rememberUi(); closeSheet(); toast('🔐 Nouveau code enregistré');
}

/* ---------- Outils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n, d = 0) => (n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d });
const signed = n => (n > 0 ? '+' : '') + eur(n);
const thisMonth = () => today().slice(0, 7);
// Date locale (et non UTC : une dépense notée à 0 h 30 en France est bien du jour même).
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const latestMonth = () => S.tx.filter(t => !t.auto).reduce((a, t) => (t.date > a ? t.date : a), '').slice(0, 7) || thisMonth();
// À l'ouverture : le mois en cours s'il a des opérations ; sinon le dernier mois complet (des chiffres qui veulent dire quelque chose).
const landingMonth = () => { const lm = latestMonth(); if (lm === thisMonth() || fullMonth(S, lm, V())) return lm; const p = shiftMonth(lm, -1); return fullMonth(S, p, V()) ? p : lm; };
const monthName = m => new Date(m + '-15').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const dayName = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
const accName = a => (S.accounts[a] && S.accounts[a].name) || a;
const nice = s => s.charAt(0) + s.slice(1).toLowerCase();
const plural = (n, w) => `${n} ${w}${n > 1 && !/s$/.test(w) ? 's' : ''}`; // « mois » est invariable
const potSaved = p => { const b = p.acc ? balanceOf(S, p.acc) : null; return b !== null ? b : p.moves.reduce((a, m) => a + m.amount, 0); };
const lastDay = m => shiftMonth(m, 1) + '-01' > today() ? today() : new Date(Date.UTC(+m.slice(0, 4), +m.slice(5), 0)).toISOString().slice(0, 10);

    const etat = { lastCheck, streak: streak(days, d), week: r.week || '', month: r.month || '', prev: monthName(shiftMonth(thisMonth(), -1)), todo };
    if (self.caches) caches.open('mescomptes-etat').then(c => c.put('etat.json', new Response(JSON.stringify(etat), { headers: { 'Content-Type': 'application/json' } }))).catch(() => {});

    ${cats.slice(0, 6).map(([c, v]) => `<div class="hb click" data-a="${c === 'autres' && toSort().length ? 'goSort' : 'goCat'}" data-c="${c}">${ico(cat(c))}<span class="ell">${c === 'autres' && st.tx.some(t => t.conf === 'guess') ? 'Autres / à ranger' : cat(c).name}</span><span><span class="mute sm">${Math.round(v / tot * 100)} %</span> <b>${eur(v)}</b>${arrow(c)}</span>
      <div class="bar"><i style="width:${v / mx * 100}%;background:${cat(c).color}"></i></div></div>`).join('') || '<p class="mute">Aucune dépense ce mois-ci pour l\'instant.</p>'}
    ${ref && cats.some(([c]) => arrow(c)) ? `<p class="sm mute hint">▲ ambre : plus que d'habitude · ▼ vert : moins que d'habitude${pc ? ` (à la même date, du 1er au ${pc.day})` : ' (médiane des 3 derniers mois complets)'}.</p>` : ''}
    <div class="chips"><button class="btn sm ghost" data-a="tab" data-t="trends">Toutes les familles et l'évolution →</button></div></section>`;
  // Mois sans aucune vraie opération (seulement des prévus) : on ne fabrique pas de « fin de mois », on dit ce qui manque.
  const waiting = isNow && !st.tx.some(t => !t.auto) && lastReal && lastReal < ui.month;
  const pin = st.tx.filter(t => t.amount > 0).reduce((a, t) => a + t.amount, 0), pout = -st.tx.filter(t => t.amount < 0).reduce((a, t) => a + t.amount, 0);
  const waitHero = `<section class="card span hero w-wait"><button class="wx" data-a="wx">${WX.wait[0]} ${WX.wait[1]}</button><div class="mute">${monthName(ui.month)}</div>

    <p class="sm mute" style="margin:0">Vos opérations s'arrêtent au ${lastReal ? dayName(lastReal) : '—'}. Importez les relevés depuis cette date, ou notez vos dépenses du jour (＋).</p>
    ${pin || pout ? `<div class="chips"><span>🔁 Déjà prévu ce mois-ci : ${[pin ? '+' + eur(pin) : '', pout ? '−' + eur(pout) : ''].filter(Boolean).join(' / ')}</span></div>` : ''}
    <div class="chips"><button class="btn" data-a="maj">⚡ Mise à jour express</button><button class="btn ghost" data-a="import">Relevés PDF</button>${latestMonth() < ui.month ? `<button class="btn ghost" data-a="goMonth" data-m="${latestMonth()}">‹ Voir ${new Date(latestMonth() + '-15').toLocaleDateString('fr-FR', { month: 'long' })}</button>` : ''}</div></section>`;
  // Chiffres anciens : un bandeau discret en haut, l'accueil reste entièrement consultable.
  const lastR = lastRealDate(), late = lastR && dayNum(today()) - dayNum(lastR) > 10;
  const rescued = S.rescued ? `<section class="card span stale">⚠️ <b>Vos données ont été relues en mode secours</b> : rien n'est effacé, une copie intacte est gardée.
    <div class="chips" style="margin:8px 0 0"><button class="btn sm" data-a="diag">Vérifier ce téléphone</button><button class="btn sm ghost" data-a="tab" data-t="set">Versions précédentes</button></div></section>` : '';
  const stale = late && !waiting ? `<section class="card span stale"><div class="grow">📅 <b>Vos chiffres s'arrêtent au ${dayName(lastR)}.</b>${ui.month !== thisMonth() ? ` <span class="sm mute">Vous voyez ${monthName(ui.month)}${fullMonth(S, ui.month, V()) ? ', le dernier mois complet' : ''}.</span>` : ''}</div>
    <div class="chips" style="margin:8px 0 0"><button class="btn sm" data-a="maj">⚡ Mise à jour express</button><button class="btn sm ghost" data-a="import">Relevés PDF</button></div></section>` : '';
  return rescued + stale + (waiting ? waitHero : hero) + (isNow ? ritualCard() : '') + actions + goal + (waiting ? '' : where);
}

/* ---------- Épargner : ① ce qu'on peut changer → ② nos engagements → ③ nos objectifs ---------- */
function merchantAvg(tok, months) {
  const re = new RegExp('\\b' + tok + '\\b'), tx = activeTx(S).filter(t => months.includes(t.date.slice(0, 7)) && inAcc(V(), t.acc) && t.amount < 0 && re.test(norm(t.label + ' ' + t.detail)));
  return months.length ? -tx.reduce((a, t) => a + t.amount, 0) / months.length : 0;
}
function epargner() {

  const head = `<section class="card span"><h2>Épargner · ${esc(whoName(ui.who))}</h2>

    return `<div class="pr">${ico(cat(i.cat))}

  const res = engagementResults(S, ui.month, V(), B()), dim = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate(), dayNow = new Date().getDate();
  // Jours vraiment connus ce mois-ci (dernier relevé ou saisie) : diviser par aujourd'hui sous-estimerait le rythme.

    const line = past && !r.full ? (over ? `<span class="warm">Au-delà de ${eur(r.spent - r.target)}</span>` : `⏳ ${eur(r.spent)} connus : verdict quand le relevé de fin de mois sera importé`)

      : over ? `<span class="warm">Au-delà de ${eur(r.spent - r.target)}</span>` : `Encore ${eur(r.target - r.spent)}${pace > r.target ? ` · à ce rythme, ~${eur(pace)} en fin de mois` : ''}`;

  const pots = myPots().map(p => {

      <div class="sm">${left <= 0 ? '🎉 Objectif atteint !' : `Encore ${eur(left)} · ${now ? `à votre rythme (${eur(pace)}/mois) : <b>${now}</b>` : 'pas encore de rythme mesuré'}${pl.total && withPlan !== now ? ` · avec vos actions : <b class="pos">${withPlan}</b>` : ''}`}</div>

}

/* ---------- Comptes : soldes, compte joint, prélèvements, charges annuelles ---------- */

    ${myAssets().map(x => `<div class="row"><span class="em" style="--c:#0284c7">📈</span><span class="grow ell">${esc(x.name)} <span class="tag">placement</span></span><b>${eur(x.value)}</b></div>`).join('')}
    ${loans.map(l => `<div class="row"><span class="em" style="--c:#8b5cf6">🏠</span><span class="grow ell">${esc(l.name)} <span class="tag">reste dû</span></span><b>−${eur(l.remaining)}</b></div>`).join('')}
    <div class="chips">${sav ? `<span>dont épargne <b class="pos">${eur(sav)}</b></span>` : ''}${(loans.length || myAssets().length) && known.length ? `<span>Patrimoine net <b>${eur(tot + myAssets().reduce((a, x) => a + x.value, 0) - debt)}</b></span>` : ''}</div>
    ${bal.flatMap(b => (b.a.gaps || []).map(g => `<p class="sm warm">⚠ ${esc(b.a.name)} : il manque le relevé du ${new Date(g.from + 'T12:00').toLocaleDateString('fr-FR')} au ${new Date(g.to + 'T12:00').toLocaleDateString('fr-FR')}.</p>`)).join('')}
    ${bal.some(b => b.a.check && Math.abs(b.a.check.diff) >= 0.01) ? '<p class="sm warm">⚠ Un relevé ne tombe pas juste (départ + opérations ≠ fin) : une ligne n\'a pas été lue. Envoyez-le moi pour que j\'adapte la lecture.</p>' : ''}
    ${known.length < bal.length ? '<p class="sm mute hint">« solde ? » : il sera lu dans le prochain relevé PDF, ou saisissez-le dans Réglages (pratique pour un livret).</p>' : '<p class="sm mute hint">Touchez un compte pour voir ses opérations.</p>'}</section>`;
  else {
    const HB = Object.entries(S.histBal || {}).filter(([, b]) => ui.who === 'foyer' || b.owner === ui.who);
    const last = HB.map(([n, b]) => { const m = Object.keys(b.months).filter(x => x <= ui.month).sort().pop(); return m ? { n, b, m, v: b.months[m] } : null; }).filter(Boolean);
    comptes = last.length ? `<section class="card span"><h2>Soldes · ${eur(last.reduce((a, x) => a + x.v, 0))}</h2>
      ${last.map(x => `<div class="row"><span class="em" style="--c:${x.b.savings ? '#10b981' : '#6366f1'}">${x.b.savings ? '🐷' : '🏦'}</span><span class="grow ell">${esc(x.n)}${ui.who === 'foyer' && x.b.owner ? ` <span class="tag">${esc(whoName(x.b.owner))}</span>` : ''}</span><b>${eur(x.v)}</b></div>`).join('')}
      <p class="sm mute hint">Soldes de fin de mois d'après le tableur (${monthName(last[0].m)}). Importez vos relevés pour les suivre au jour le jour.</p></section>`
      : '<section class="card span"><h2>Soldes</h2><p class="mute">Aucun compte pour ce profil.</p></section>';
  }

  let joint = '';
  if (['foyer', 'commun'].includes(ui.who) && Object.values(S.accounts).some(a => a.owner === 'commun' && !a.hist)) {
    const js = jointSplit(S, ui.month), t = Object.values(js.by).reduce((a, v) => a + v, 0);
    const inc = Object.fromEntries(S.people.map(p => [p.id, S.tx.filter(x => x.date.startsWith(ui.month) && S.accounts[x.acc]?.owner === p.id && x.cat === 'revenus' && x.amount > 0).reduce((a, x) => a + x.amount, 0)]));
    const it = Object.values(inc).reduce((a, v) => a + v, 0);
    joint = `<section class="card span"><h2>Compte joint · ${eur(t)} versés en ${monthName(ui.month)}</h2>
      ${S.people.map(p => { const v = js.by[p.id] || 0; return `<div style="padding:4px 0"><div class="row" style="padding:0"><span class="grow">${esc(p.name)}</span><b>${eur(v)}</b><span class="mute sm" style="width:44px;text-align:right">${t ? Math.round(v / t * 100) : 0} %</span></div>
        <div class="bar"><i style="width:${t ? v / t * 100 : 0}%;background:var(--acc)"></i></div></div>`; }).join('')}
      ${it && Object.values(inc).every(v => v > 0) ? `<p class="sm mute hint">Pour comparer, la part de chacun dans les revenus du mois : ${S.people.map(p => `${esc(p.name)} ${Math.round(inc[p.id] / it * 100)} %`).join(' · ')}.</p>` : ''}
      ${js.unknown.length ? `<p class="sm warm">${plural(js.unknown.length, 'versement')} sans auteur : voir « Vos actions » sur l'accueil.</p>` : ''}</section>`;
  }

  const rec = recurring(S, V()).filter(r => r.sign < 0);
  const recCard = rec.length ? `<section class="card span"><h2>Prélèvements réguliers · ${eur(rec.reduce((a, r) => a + r.amount, 0))}/mois</h2>
    ${rec.map(r => { const ml = merchantLever(S, { label: r.name }); return `<div class="row">${ico(cat(r.cat))}<span class="grow ell">${esc(nice(r.name))}<div class="sm mute">vers le ${r.day}${ml && ml[1] !== 'essentiel' ? ` · ${LEVERS[ml[1]].emoji} ${LEVERS[ml[1]].label.toLowerCase()}` : ''}</div></span><b>${eur(r.amount, r.amount < 100 ? 2 : 0)}</b></div>`; }).join('')}
    <p class="sm mute hint">Repérés tout seuls : même montant, même période, au moins 3 mois. Un abonnement oublié se voit ici ; décidez quoi en faire dans Épargner.</p></section>` : '';

  const ann = annualCharges(S, ui.month, V());
  const annCard = ann.length ? `<section class="card span"><h2>Charges annuelles · ${eur(ann.reduce((a, x) => a + x.perMonth, 0))} à prévoir par mois</h2>
    ${ann.map(x => `<div class="row">${ico(cat(x.cat))}<span class="grow ell">${esc(nice(x.name))}<div class="sm mute">${eur(x.total)} en ${new Date(x.next + '-15').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</div></span>
      <b>${eur(x.perMonth)}/mois</b><button class="ib" data-a="annHide" data-k="${esc(x.key)}" title="Ce n'est pas une charge annuelle" aria-label="Masquer">×</button></div>`).join('')}
    <p class="sm mute hint">Mettre ce montant de côté chaque mois évite la mauvaise surprise le jour J.</p></section>` : '';
  const fc = realIds().map(id => [id, forecast(S, id)]).filter(([, f]) => f && f.items.length);
  const coming = fc.length ? `<section class="card span"><h2>À venir · prélèvements et rentrées</h2>
    ${fc.map(([id, f]) => `<div style="padding:6px 0 12px"><div class="row" style="padding:0"><b class="grow">${esc(accName(id))}</b><span class="sm mute">${eur(f.start)} au ${shortDate(f.from)}</span></div>
      ${f.need ? `<div class="note" style="background:var(--warms);margin:6px 0">⚠ ${f.start < 0 ? `Compte à ${eur(f.start)}` : `${eur(f.dueTotal)} de prélèvements`} avant ${f.nextIn ? `les rentrées du ${shortDate(f.nextIn.date)}` : 'la fin du mois'} : prévoir <b>~${eur(Math.ceil(f.need / 10) * 10)}</b>${f.start < 0 ? '' : ` avant le ${shortDate(f.short)}`}.</div>`
        : `<div class="sm pos" style="margin:4px 0 6px">✔ ${f.dueTotal ? `Les ${eur(f.dueTotal)} de prélèvements avant ${f.nextIn ? `les rentrées du ${shortDate(f.nextIn.date)}` : 'la fin du mois'} sont couverts.` : `Rien à couvrir avant ${f.nextIn ? `les rentrées du ${shortDate(f.nextIn.date)}` : 'la fin du mois'}.`}</div>`}
      ${f.items.slice(0, 10).map(it => `<div class="row fc" style="padding:5px 0;border:0;gap:8px"><span class="sm mute" style="width:46px;flex:none">${shortDate(it.date)}</span>${ico(cat(it.cat))}<span class="grow ell sm">${esc(nice(it.name))}</span>
        <span class="sm ${it.amount > 0 ? 'pos' : ''}">${it.expected ? '≈ ' : ''}${signed(Math.round(it.amount))}</span></div>`).join('')}</div>`).join('')}
    <p class="sm mute hint">Prélèvements fixes repérés sur vos relevés, et rentrées habituelles (≈, montant moyen). Les dépenses du quotidien ne sont pas prévues : elles varient trop pour être fiables.</p></section>` : '';
  const toTrends = `<section class="card span click" data-a="tab" data-t="trends" style="display:flex;align-items:center;gap:12px"><span class="em" style="--c:var(--acc)">📈</span><span class="grow"><b>Tendances, tableau et bilan de l'année</b><div class="sm mute">évolution sur 12 mois, par famille, export Excel</div></span><span class="mute">›</span></section>`;
  return comptes + coming + joint + recCard + annCard + toTrends;
}

/* ---------- Tendances ---------- */
function trends() {
  const ms = Array.from({ length: 12 }, (_, i) => shiftMonth(ui.month, i - 11));
  const have = new Set(S.tx.filter(t => inAcc(V(), t.acc)).map(t => t.date.slice(0, 7)));
  const D = ms.map(m => ({ m, ok: fullMonth(S, m, V()), part: have.has(m) && !fullMonth(S, m, V()), ...monthStats(S, m, V()) })), ok = D.filter(d => d.ok);
  if (ok.length < 2) return `<section class="card span empty"><div style="font-size:40px">📈</div><p>Il faut au moins <b>2 mois</b> de relevés pour voir des tendances.</p>
    <p class="mute">Importez les relevés des derniers mois, ou votre tableau de suivi.</p><button class="btn" data-a="import">＋ Importer</button></section>`;
  const mean = f => ok.reduce((a, d) => a + f(d), 0) / ok.length;
  const withInc = ok.filter(d => d.income > 0);
  const rate = withInc.length ? withInc.reduce((a, d) => a + (d.income - d.spent) / d.income, 0) / withInc.length : null;
  const short = m => new Date(m + '-15').toLocaleDateString('fr-FR', { month: 'narrow' });

  const prev = avgBy(S, ui.month, V()), cur = monthStats(S, ui.month, V());
  const deltas = [...new Set([...Object.keys(prev), ...Object.keys(cur.by)])].filter(c => cat(c).kind === 'var')
    .map(c => [c, (cur.by[c] || 0) - (prev[c] || 0)]).sort((a, b) => a[1] - b[1]);
  const down = deltas.filter(x => x[1] < -10).slice(0, 3), up = deltas.filter(x => x[1] > 10).reverse().slice(0, 3);
  const prevTot = Object.entries(prev).filter(([c]) => cat(c).kind !== 'in').reduce((a, [, v]) => a + v, 0);
  const recap = !fullMonth(S, ui.month, V()) ? `<section class="card span"><h2>${monthName(ui.month)} en bref</h2><p class="mute" style="margin:0">Mois incomplet : la comparaison avec vos habitudes viendra avec le relevé de fin de mois (sinon, une baisse apparaîtrait qui n'existe pas).</p></section>`
    : Object.keys(prev).length ? `<section class="card span"><h2>${monthName(ui.month)} en bref</h2>
    <p style="margin-top:0">Dépenses : <b class="${cur.spent <= prevTot ? 'pos' : ''}">${signed(Math.round(cur.spent - prevTot))}</b> par rapport aux 3 mois précédents (${eur(cur.spent)} contre ~${eur(prevTot)} d'habitude).</p>
    ${down.length ? `<div class="sm mute">En baisse</div>${down.map(([c, d]) => `<div class="row">${ico(cat(c))}<span class="grow">${cat(c).name}</span><b class="pos">${eur(d)}</b></div>`).join('')}` : ''}
    ${up.length ? `<div class="sm mute" style="margin-top:6px">En hausse</div>${up.map(([c, d]) => `<div class="row">${ico(cat(c))}<span class="grow">${cat(c).name}</span><b>+${eur(d)}</b></div>`).join('')}` : ''}</section>` : '';

  const mx = Math.max(1, ...D.flatMap(d => [d.income, d.spent]));
  const flows = `<section class="card span"><h2>Entrées et dépenses · 12 mois</h2>
    <div class="trend t12">${D.map(d => `<div class="col ${d.m === ui.month ? 'on' : ''}" ${d.part ? 'style="opacity:.35"' : ''} data-a="goMonth" data-m="${d.m}" title="${monthName(d.m)} : +${eur(d.income)} / −${eur(d.spent)}${d.part ? ' (incomplet)' : ''}">
      <div class="bars"><i style="height:${d.income / mx * 100}%;background:var(--acc)"></i><i style="height:${Math.max(0, d.spent) / mx * 100}%;background:var(--mute);opacity:.55"></i></div>
      <span class="sm mute">${short(d.m)}</span></div>`).join('')}</div>
    <div class="chips"><span><b class="pos">▮</b> entrées ~${eur(mean(d => d.income))}/mois</span><span><b class="mute">▮</b> dépenses ~${eur(mean(d => d.spent))}/mois</span>
      ${rate !== null ? `<span>Vous gardez <b>${Math.round(rate * 100)} %</b> de ce qui rentre</span>` : ''}</div>
    <p class="sm mute hint">Touchez un mois pour l'afficher partout.${D.some(d => d.part) ? ' Mois pâles : relevés incomplets, hors moyennes.' : ''}</p></section>`;

  const withBal = realIds().filter(id => S.accounts[id].balance);
  let patri = '';
  if (withBal.length) {
    const P = ms.map(m => withBal.reduce((a, id) => a + balanceAt(S, id, lastDay(m)), 0));
    const lo = Math.min(...P), hi = Math.max(...P), span = hi - lo || 1;
    patri = `<section class="card span"><h2>Total des comptes · ${eur(P[11])}</h2>
      <svg class="line" viewBox="0 0 300 100" preserveAspectRatio="none" aria-label="Évolution sur 12 mois"><polyline points="${P.map((v, i) => `${i / 11 * 300},${95 - (v - lo) / span * 85}`).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <div class="chips"><span>il y a 12 mois : ${eur(P[0])}</span><span class="${P[11] >= P[0] ? 'pos' : ''}">${signed(P[11] - P[0])} sur un an</span></div>
      <p class="sm mute hint">Reconstitué à partir des soldes connus (${withBal.map(id => esc(accName(id))).join(', ')}).</p></section>`;
  }
  let hb = '';
  const H = Object.entries(S.histBal || {}).filter(([, b]) => ui.who === 'foyer' || b.owner === ui.who);
  if (H.length) {
    const hm = [...new Set(H.flatMap(([, b]) => Object.keys(b.months)))].sort();
    const tot = hm.map(m => H.reduce((a, [, b]) => a + (b.months[m] || 0), 0)), sav = hm.map(m => H.filter(([, b]) => b.savings).reduce((a, [, b]) => a + (b.months[m] || 0), 0));
    const lo = Math.min(0, ...sav), hi = Math.max(...tot), sp = hi - lo || 1, pt = arr => arr.map((v, i) => `${i / Math.max(1, hm.length - 1) * 300},${95 - (v - lo) / sp * 85}`).join(' ');
    hb = `<section class="card span"><h2>Comptes & épargne · d'après le tableur</h2>
      <svg class="line" viewBox="0 0 300 100" preserveAspectRatio="none" aria-label="Évolution"><polyline points="${pt(tot)}" fill="none" stroke="var(--mute)" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="${pt(sav)}" fill="none" stroke="#10b981" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
      <div class="chips"><span><b style="color:#10b981">▮</b> épargne ${eur(sav[0])} → <b>${eur(sav.at(-1))}</b></span><span><b class="mute">▮</b> total ${eur(tot[0])} → <b>${eur(tot.at(-1))}</b></span><span>${monthName(hm[0])} → ${monthName(hm.at(-1))}</span></div></section>`;
  }

  const fam = SPEND.concat(cat('couple')).map(c => {
    const vals = D.map(d => Math.max(0, d.by[c.id] || 0)), okv = D.map((d, i) => d.ok ? vals[i] : null).filter(v => v !== null);
    const a3 = okv.slice(-3), b3 = okv.slice(-6, -3);
    const avg = a3.reduce((x, v) => x + v, 0) / (a3.length || 1), before = b3.length ? b3.reduce((x, v) => x + v, 0) / b3.length : null;
    return { c, vals, avg, pct: before ? (avg - before) / before : null };
  }).filter(x => x.avg >= 5).sort((a, b) => b.avg - a.avg);
  const famCard = `<section class="card span"><h2>Par famille · moyenne des 3 derniers mois</h2>
    ${fam.map(x => `<div class="row click" data-a="goCat" data-c="${x.c.id}">${ico(x.c)}
      <span class="grow ell">${x.c.name}<div class="sm mute">~${eur(x.avg)}/mois${x.c.hint ? ' · ' + x.c.hint : ''}</div></span>${spark(x.vals, x.c.color)}
      <span class="sm" style="width:64px;text-align:right">${x.pct === null ? '' : Math.abs(x.pct) < 0.05 ? '<span class="mute">→ stable</span>' : x.pct < 0 ? `<span class="pos">↘ ${Math.round(x.pct * 100)} %</span>` : `<span class="mute">↗ +${Math.round(x.pct * 100)} %</span>`}</span></div>`).join('')}
    <p class="sm mute hint">Barres : les 12 derniers mois. Flèche : les 3 derniers mois comparés aux 3 d'avant.</p></section>`;

  const tb = tableData(ms);
  const table = `<section class="card span"><h2>Tableau mensuel</h2><div class="tblw"><table class="tbl">
    <thead><tr>${tb.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${tb.rows.map(r => `<tr class="${r.sec ? 'sec' : ''}"><td title="${esc(r.label)}">${esc(r.label)}</td>${r.vals.map(v => `<td>${v ? Math.round(v).toLocaleString('fr-FR') : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="chips"><button class="btn sm" data-a="csv">Exporter pour Excel</button><span class="sm mute">moyenne et total sur 12 mois, comme le tableur</span></div></section>`;
  // Bilan de l'année (celle du mois affiché) : en tête en décembre et janvier, sinon en fin d'écran.
  const yr = ui.month.slice(0, 4), yms = Array.from({ length: 12 }, (_, i) => `${yr}-${String(i + 1).padStart(2, '0')}`).filter(m => fullMonth(S, m, V()));
  let year = '';
  if (yms.length >= 3) {
    const Y = yms.map(m => ({ m, ...monthStats(S, m, V()) })), sum = f => Y.reduce((a, d) => a + f(d), 0);
    const inc = sum(d => d.income), sp = sum(d => d.spent), sv = sum(d => d.saved), best = [...Y].sort((a, b) => a.spent - b.spent)[0];
    const half = Math.ceil(Y.length / 2), h1 = Y.slice(0, half), h2 = Y.slice(half);
    const evo = SPEND.filter(c => c.kind === 'var').map(c => { const a = h1.reduce((x, d) => x + Math.max(0, d.by[c.id] || 0), 0) / h1.length, b = h2.length ? h2.reduce((x, d) => x + Math.max(0, d.by[c.id] || 0), 0) / h2.length : a; return [c, b - a]; }).sort((a, b) => a[1] - b[1]);
    const wins = yms.filter(m => m < thisMonth()).reduce((n, m) => n + engagementResults(S, m, V(), B()).filter(r => r.ok).length, 0);
    year = `<section class="card span"><h2>🎉 Votre année ${yr} · ${plural(yms.length, 'mois')} complet${yms.length > 1 ? 's' : ''}</h2>
      <div class="kpis"><div><span class="sm mute">Entré</span><b>${eur(inc)}</b></div><div><span class="sm mute">Dépensé</span><b>${eur(sp)}</b></div>
        <div><span class="sm mute">Épargné</span><b class="pos">${eur(sv)}</b></div><div><span class="sm mute">Gardé sur ce qui rentre</span><b>${inc ? Math.round((inc - sp) / inc * 100) : 0} %</b></div></div>
      <div class="chips"><span>Mois le plus léger : <b>${monthName(best.m)}</b> (${eur(best.spent)})</span>
        ${evo[0] && evo[0][1] < -10 ? `<span>Plus belle baisse : <b class="pos">${evo[0][0].emoji} ${evo[0][0].name} ${eur(evo[0][1])}/mois</b></span>` : ''}
        ${wins ? `<span>🏅 ${plural(wins, 'engagement')} tenu${wins > 1 ? 's' : ''}</span>` : ''}</div></section>`;
  }
  const yearFirst = /-(12|01)$/.test(ui.month);
  const back = `<section class="card span click" data-a="tab" data-t="accounts" style="padding:12px 16px"><span class="mute">‹ Comptes</span></section>`;
  return back + (yearFirst ? year : '') + recap + flows + famCard + patri + hb + table + (yearFirst ? '' : year);
}

// Même structure que le tableur de suivi : entrées par source, dépenses par famille, moyenne, total.
function tableData(ms) {
  const st = ms.map(m => monthStats(S, m, V())), src = {};
  st.forEach((x, i) => { for (const t of x.tx) if (cat(t.cat).kind === 'in' && t.amount > 0) { const k = S.accounts[t.acc]?.hist ? t.label.trim() : merchantKey(t.label); (src[k] ||= Array(ms.length).fill(0))[i] += t.amount; } });
  const line = (label, vals, sec) => { const n = st.filter(x => x.tx.length).length || 1, tot = vals.reduce((a, v) => a + v, 0); return { label, sec, vals: [...vals, tot / n, tot] }; };
  const rows = [line('Entrées', st.map(x => x.income), true)];
  for (const [k, v] of Object.entries(src).sort((a, b) => b[1].reduce((x, y) => x + y) - a[1].reduce((x, y) => x + y))) rows.push(line(k, v));
  rows.push(line('Dépenses', st.map(x => x.spent), true));
  for (const c of SPEND.concat(cat('couple'))) { const v = st.map(x => Math.max(0, x.by[c.id] || 0)); if (v.some(Boolean)) rows.push(line(`${c.emoji} ${c.name}`, v)); }
  rows.push(line('Épargné', st.map(x => x.saved), true), line('Solde du mois', st.map(x => x.rest), true));
  return { head: ['', ...ms.map(m => new Date(m + '-15').toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' })), 'Moy.', 'Total'], rows };
}

/* ---------- Réglages ---------- */
function settings() {
  const owners = [...S.people.map(p => [p.id, p.name]), ['commun', 'Commun (joint)']];
  const accs = Object.entries(S.accounts).map(([id, a]) => a.hist ? `<div class="row"><span class="em" style="--c:#a16207">📒</span><span class="grow ell">${esc(a.name)}<div class="sm mute">${S.tx.filter(t => t.acc === id).length} postes · remplacé mois par mois par les vrais relevés</div></span>
      <button class="btn sm ghost" data-a="accDel" data-id="${esc(id)}">Retirer</button></div>` : `<div class="row" style="flex-wrap:wrap">
      <input class="f grow" style="min-width:160px" value="${esc(a.name)}" data-c="accName" data-id="${esc(id)}" aria-label="Nom du compte">

      <label class="sm"><input type="checkbox" data-c="accSav" data-id="${esc(id)}" ${a.savings ? 'checked' : ''}> livret / épargne</label>

  const v = $('#view');

    v.className = ui.tab === 'home' && S.tx.length && viewIds().length ? 'two' : '';
    v.innerHTML = ({ home, ops, save: epargner, trends, accounts, set: settings }[ui.tab] || home)(); (v.querySelector('.hero') || v.firstElementChild)?.insertAdjacentHTML('afterend', coach(ui.tab)); // le conseil sous le grand chiffre
    if (ui.demo) v.insertAdjacentHTML('afterbegin', '<section class="demo span"><span class="grow">👀 <b>Exemple fictif</b> · rien n\'est enregistré</span><button class="btn sm" data-a="demoEnd">Quitter l\'exemple</button></section>');

    if (ui.tab === 'ops') renderList();
    if (ui.tab === 'set') fillSnaps();
  } catch (e) { console.error(e); v.innerHTML = oops(e); return; }

}

}

addEventListener('unhandledrejection', e => { console.error(e.reason); toast('Petit souci : ' + ((e.reason && e.reason.message) || 'action interrompue') + '. Rien n\'est perdu.'); });
// Mémorise l'endroit où l'on est (après chaque affichage, en défilant, et au moment de quitter l'app).

}

// Le chiffre du mois « monte » à l'ouverture (désactivé si l'iPhone demande moins d'animations).
function countUp() {
  const el = document.querySelector('[data-count]');
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = +el.dataset.count, t0 = performance.now(), d = 650;
  const step = t => { const k = Math.min(1, (t - t0) / d), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = signed(v); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// Glisser à gauche / à droite : mois suivant / précédent.
let touch = null;
document.addEventListener('touchstart', e => { if (!(e.target.closest && e.target.closest('.tblw, select, input, .who'))) touch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1]; touch = null;

}, { passive: true });

function learn(id, c) {
  const t = S.tx.find(x => x.id === id);
  t.cat = c; t.manual = true;
  if (!learnable(t)) { recompute(S); save(); return toast(`Rangé : ${cat(c).emoji} ${cat(c).name}\n(chaque chèque est rangé un par un)`); }
  S.rules[ruleKey(t)] = c; recompute(S); save();
  const same = S.tx.filter(x => x !== t && ruleKey(x) === ruleKey(t)).length;
  toast(`Retenu : « ${merchantKey(t.label)} » → ${cat(c).emoji} ${cat(c).name}${same ? `\n(+ ${plural(same, 'autre opération')} rangée${same > 1 ? 's' : ''})` : ''}`);
}

  catch (err) { console.error(err); toast('Petit souci : ' + err.message + '. Rien n\'est perdu.'); render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; renderList(); }
  if (e.target.id === 'qLabel' && !$('#qCat').dataset.touched) $('#qCat').value = classify({ label: e.target.value, amount: -1 }).cat;
