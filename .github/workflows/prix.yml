name: prix
# Régénère foyer/prix.json (prix moyens Insee, licence ouverte) et foyer/produits.json (Open Food Facts + Open Prices, ODbL),
# chaque mois et à chaque changement des scripts, puis les enregistre sur la branche. Aucun appel pendant l'usage de l'app.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 16 * *'   # le 16 de chaque mois : l'Insee publie les prix moyens du mois précédent vers le 15
  push:
    paths: ['foyer/scripts/prix.mjs', 'foyer/scripts/produits.mjs', 'foyer/src/core/refprice.ts', 'foyer/src/core/products.ts', '.github/workflows/prix.yml']
permissions:
  contents: write
concurrency: { group: prix-${{ github.ref }}, cancel-in-progress: false }
jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: foyer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/prix.mjs
      - run: node scripts/produits.mjs
      - run: npm run build
      - name: Enregistrer les prix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prix.json produits.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Foyer : prix de référence et étude qualité-prix régénérés"
          # La branche a pu avancer pendant la génération : on se remet à jour avant de pousser (3 essais).
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 5; done
          exit 1
